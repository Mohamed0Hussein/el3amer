# Builds the preview APK on GitHub's machines instead of EAS cloud, so it uses
# no EAS build quota. `eas build --local` still signs with the keystore stored
# on EAS and reads the EAS "preview" environment variables, so the APK installs
# over the ones built before. Run it from the Actions tab (Run workflow).
# Needs the EXPO_TOKEN repository secret (expo.dev > Account settings > Access tokens).
name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          npx eas-cli@latest build --platform android --profile preview --local --non-interactive --output "el3amer-$VERSION.apk"
      # One release per version: rebuilding the same version replaces the APK.
      - name: Attach to release v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="el3amer-$VERSION.apk"
          gh release create "v$VERSION" "$APK" --title "$VERSION" --target "$GITHUB_SHA" --notes "APK built from $GITHUB_SHA" \
            || gh release upload "v$VERSION" "$APK" --clobber
